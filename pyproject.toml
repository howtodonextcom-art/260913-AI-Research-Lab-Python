[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vietlott-quant-lab"
version = "0.1.0"
description = "Quantitative research lab for Vietlott Mega 6/45 ranking and candidate-pool studies (not a prediction product)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Vietlott Quant Research Lab" }]
dependencies = [
    "streamlit",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "pydantic",
    "pydantic-settings",
    "duckdb",
    "pyarrow",
    "pandas",
    "numpy",
    "scipy",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vietlott_quant_lab"]

[tool.hatch.build.targets.sdist]
include = ["src/vietlott_quant_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["vietlott_quant_lab"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "plotly.*"]
ignore_missing_imports = true
