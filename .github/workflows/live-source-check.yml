name: Live source check

on:
  workflow_dispatch:
  schedule:
    # Optional weekly probe (UTC). Failures must not mutate canonical data.
    - cron: "0 6 * * 1"

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Probe vietlott.vn (read-only)
        run: python scripts/live_source_check.py
        env:
          # Explicit: this job may network; the script must never write canonical datasets.
          VIETLOTT_LIVE_SOURCE_CHECK: "1"
