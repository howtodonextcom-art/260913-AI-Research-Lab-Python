name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts app.py pages

      - name: Mypy
        # Strict mypy may fail early while modules are stubs; do not block CI green for P0–P12 scaffolding.
        continue-on-error: true
        run: mypy src/vietlott_quant_lab

      - name: Pytest
        run: pytest -q
        env:
          # Never hit vietlott.vn from CI unit/integration runs.
          VIETLOTT_ALLOW_LIVE_FETCH: "0"
