name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts app.py pages

      - name: Mypy
        run: mypy src/vietlott_quant_lab

      - name: Pytest
        run: pytest -q
        env:
          # Never hit vietlott.vn from CI unit/integration runs.
          VIETLOTT_ALLOW_LIVE_FETCH: "0"

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Browser E2E (real Chromium against local canonical data)
        run: pytest tests/browser -q
        env:
          # Real-browser suite starts its own local `streamlit run` server against the
          # repo's bundled canonical data — never live vietlott.vn.
          VIETLOTT_ALLOW_LIVE_FETCH: "0"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: artifacts/reports/browser_screenshots/
          if-no-files-found: ignore
